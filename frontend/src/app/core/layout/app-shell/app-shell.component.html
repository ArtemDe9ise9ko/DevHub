<div class="app-shell">
  <header class="app-shell__header">
    <div class="app-shell__container">
      <div class="app-shell__logo">
        <h1 class="app-shell__title">DevHub</h1>
      </div>
      <nav class="app-shell__nav">
        <ul class="app-shell__nav-list">
          <li class="app-shell__nav-item" *ngIf="isAuthenticated()">
            <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
          </li>
          <li class="app-shell__nav-item">
            <a routerLink="/github-search" routerLinkActive="active"
              >GitHub Search</a
            >
          </li>
          <li class="app-shell__nav-item" *ngIf="isAuthenticated()">
            <a routerLink="/analytics" routerLinkActive="active">Analytics</a>
          </li>
          <li class="app-shell__nav-item" *ngIf="isAuthenticated()">
            <a routerLink="/favorites" routerLinkActive="active">Favorites</a>
          </li>
          <li class="app-shell__nav-item" *ngIf="isAuthenticated()">
            <a routerLink="/search-history" routerLinkActive="active"
              >Search History</a
            >
          </li>
          <li class="app-shell__nav-item" *ngIf="!isAuthenticated()">
            <a routerLink="/login" routerLinkActive="active">Login</a>
          </li>
          <li class="app-shell__nav-item" *ngIf="!isAuthenticated()">
            <a routerLink="/register" routerLinkActive="active">Register</a>
          </li>
        </ul>

        <div class="app-shell__auth-actions" *ngIf="isAuthenticated()">
          <span class="app-shell__user-name">
            {{ currentUser()?.email || "Account" }}
          </span>
          <button
            class="app-shell__logout-button"
            type="button"
            (click)="logout()"
          >
            Logout
          </button>
        </div>
      </nav>
    </div>
  </header>

  <main class="app-shell__main">
    <div class="app-shell__container">
      <router-outlet></router-outlet>
    </div>
  </main>

  <footer class="app-shell__footer">
    <div class="app-shell__container">
      <p>&copy; 2026 DevHub. GitHub Analytics Dashboard.</p>
    </div>
  </footer>
</div>
